[workspace]
resolver = "2"
members = [
    "crates/consus",
    "crates/consus-core",
    "crates/consus-hdf5",
    "crates/consus-fits",
    "crates/consus-zarr",
    "crates/consus-netcdf",
    "crates/consus-parquet",
    "crates/consus-arrow",
    "crates/consus-compression",
    "crates/consus-io",
    "tests",
    "crates/consus-mat",
    "crates/consus-nwb",
    "crates/consus-hdmf",
    "crates/consus-python",
    "crates/consus-onnx",
    "crates/consus-npy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/consus"
homepage = "https://github.com/ryancinsight/consus"
keywords = ["hdf5", "zarr", "netcdf", "scientific-computing", "storage"]
categories = ["science", "filesystem", "encoding", "no-std"]
description = "Pure-Rust, no_std-compatible, memory-safe hierarchical and array-oriented storage formats"

[workspace.dependencies]
# Internal crates
consus-mat = { path = "crates/consus-mat", version = "0.1.0", default-features = false }
consus-nwb = { path = "crates/consus-nwb", version = "0.1.0", default-features = false }
consus-hdmf = { path = "crates/consus-hdmf", version = "0.1.0", default-features = false }
consus-core = { path = "crates/consus-core", version = "0.1.0", default-features = false }
consus-hdf5 = { path = "crates/consus-hdf5", version = "0.1.0", default-features = false }
consus-fits = { path = "crates/consus-fits", version = "0.1.0", default-features = false }
consus-zarr = { path = "crates/consus-zarr", version = "0.1.0", default-features = false }
consus-netcdf = { path = "crates/consus-netcdf", version = "0.1.0", default-features = false }
consus-parquet = { path = "crates/consus-parquet", version = "0.1.0", default-features = false }
consus-arrow = { path = "crates/consus-arrow", version = "0.1.0", default-features = false }
consus-compression = { path = "crates/consus-compression", version = "0.1.0", default-features = false }
consus-io = { path = "crates/consus-io", version = "0.1.0", default-features = false }
consus-npy = { path = "crates/consus-npy", version = "0.1.0" }
pyo3 = { version = "0.22" }
consus-onnx = { path = "crates/consus-onnx", version = "0.1.0", default-features = false }

# External dependencies
thiserror = { version = "2", default-features = false }
bytes = { version = "1", default-features = false }
smallvec = { version = "1", default-features = false }
zerocopy = { version = "0.8", default-features = false }
byteorder = { version = "1", default-features = false }
zip = { version = "6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
memmap2      = { version = "0.9" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Compression (optional)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zrip = { version = "0.8.5", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.11", default-features = false }

# Async (optional)
tokio = { version = "1", default-features = false, features = ["io-util", "fs"] }
futures-core = { version = "0.3", default-features = false }

# Parallelism: Moirai defaults provide the data-parallel API, Mnemosyne memory
# integration, and Mellinoe branded partitioning.
moirai = { package = "moirai-runtime", version = "0.5.0", git = "https://github.com/ryancinsight/Moirai" }
themis = { package = "themis-topology", version = "0.10.1", git = "https://github.com/ryancinsight/themis", default-features = false, features = ["std"] }

# Testing
proptest = { version = "1" }
criterion = { version = "0.5" }
tempfile = { version = "3" }

# ---------------------------------------------------------------------------
# Lint floor
#
# Declared once here; every member inherits it via `[lints] workspace = true`.
# `pedantic` is denied, so any pedantic class NOT named below is a hard error
# in new and touched code.
#
# The `allow` entries are a ratchet baseline, not a policy: each is a class
# that already fires on pre-existing code, recorded with its count at the time
# the floor landed (`scripts/lint_baseline.sh` re-measures). The rule is
# non-increasing — an entry may shrink and be deleted, never grow. Denying
# them outright today would be a ~4 000-site refactor; leaving the floor off
# entirely would let a 3 974th site land unnoticed.
#
# The three restriction lints below are the trust-boundary floor the standard
# requires of parser crates. They are workspace-allowed for the same ratchet
# reason and re-denied at module scope wherever the code is already clean —
# see `consus-core::parse` and `consus-io`'s bounded-read module.
# ---------------------------------------------------------------------------
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# --- Documentation debt (2 113 sites) ---
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# --- Numeric conversion debt (864 sites); the real fix is typed conversions ---
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
approx_constant = "allow"
unreadable_literal = "allow"

# --- Style debt (996 sites) ---
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
clone_on_copy = "allow"
cloned_ref_to_slice_refs = "allow"
elidable_lifetime_names = "allow"
explicit_iter_loop = "allow"
if_not_else = "allow"
inline_always = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
manual_string_new = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
needless_option_as_deref = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_char_pattern = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_literal_bound = "allow"
unnecessary_trailing_comma = "allow"
unnecessary_wraps = "allow"
uninlined_format_args = "allow"
unused_self = "allow"
used_underscore_items = "allow"
wildcard_imports = "allow"

# --- Trust-boundary restriction floor (ratchet; denied per-module where clean) ---
unwrap_used = "allow"
indexing_slicing = "allow"
arithmetic_side_effects = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
