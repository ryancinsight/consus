[build]
# Default target for development
# Uncomment for specific targets:
# target = "wasm32-unknown-unknown"

# No `target-cpu=native`: it is not portable. Committed here it codegens every CI,
# MSRV, and release build for whichever machine happened to run the build, and it
# contradicts the runtime ISA detection the codecs already perform to select their
# vector paths. `-C target-cpu=native` belongs in a local, non-distributed build
# only, per the Atlas build-configuration rules.

[alias]
xtask = "run --package xtask --"
