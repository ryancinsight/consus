[package]
name = "consus-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sync and async I/O abstractions for the Consus scientific storage library"
homepage.workspace = true
readme = "README.md"
keywords = ["io", "mmap", "storage", "positioned-io", "no-std"]
categories = ["filesystem", "asynchronous", "no-std"]

[features]
default = ["std"]
std = ["consus-core/std"]
alloc = ["consus-core/alloc"]
# Tokio-free async trait surface (AsyncReadAt/AsyncLength/... + AsyncMemCursor).
async-traits = ["std", "alloc"]
# Compatibility alias for the crate's async I/O test and facade feature names.
async-io = ["async-traits"]
mmap = ["dep:memmap2", "std"]

[dependencies]
consus-core = { workspace = true }
memmap2 = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# Async cursor tests use Tokio only as a test executor; production I/O is runtime-agnostic.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time", "io-util"] }
tempfile = { workspace = true }


[[test]]
name = "property_io"
path = "tests/property_io.rs"
required-features = ["alloc"]

[[test]]
name = "unit_sync_io"
path = "tests/unit_sync_io.rs"
required-features = ["alloc"]

[[test]]
name = "unit_mem_cursor"
path = "tests/unit_mem_cursor.rs"
required-features = ["alloc"]

[[test]]
name = "unit_mmap"
path = "tests/unit_mmap.rs"
required-features = ["mmap"]

[lints]
workspace = true
