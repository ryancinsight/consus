[package]
name = "consus-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Synchronous I/O abstractions for the Consus scientific storage library"
homepage.workspace = true
readme = "README.md"
keywords = ["io", "mmap", "storage", "positioned-io", "no-std"]
categories = ["filesystem", "no-std"]

[features]
default = ["std"]
std = ["consus-core/std"]
alloc = ["consus-core/alloc"]
mmap = ["dep:memmap2", "std"]

[dependencies]
consus-core = { workspace = true }
memmap2 = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }


[[test]]
name = "property_io"
path = "tests/property_io.rs"
required-features = ["alloc"]

[[test]]
name = "unit_sync_io"
path = "tests/unit_sync_io.rs"
required-features = ["alloc"]

[[test]]
name = "unit_mem_cursor"
path = "tests/unit_mem_cursor.rs"
required-features = ["alloc"]

[[test]]
name = "unit_mmap"
path = "tests/unit_mmap.rs"
required-features = ["mmap"]

[lints]
workspace = true
