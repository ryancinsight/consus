[package]
name = "consus-python"
version.workspace = true
# Pinned to 2021 (not the workspace's 2024): PyO3 0.22's `#[pymethods]`/
# `#[pyfunction]` macro expansion is not compatible with edition 2024's
# deny-by-default `unsafe_op_in_unsafe_fn` (yields E0133). Revisit on a PyO3 upgrade.
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Pure-Rust readers and writers for HDF5, Zarr, Parquet, netCDF-4, MATLAB, and HDMF, exposed to Python"
publish = false

[lib]
name = "consus"
# "rlib" is additive to the shipped cdylib. `cargo nextest run` builds and
# runs unit tests fine with `cdylib` alone (verified empirically), but
# `cargo test --doc` does not: rustc refuses doctests for a `cdylib`-only
# target ("doc tests are not supported for crate type(s) `cdylib`" / "no
# library targets found"). Adding `rlib` is what makes the doctest gate
# command pass for this crate at all; it changes nothing about the built
# wheel (cdylib stays first in the list and is still produced).
crate-type = ["cdylib", "rlib"]
doc = false

[dependencies]
consus-core = { workspace = true, features = ["std"] }
consus-hdf5 = { workspace = true, features = ["std", "deflate"] }
consus-io = { workspace = true, features = ["std"] }
consus-mat = { workspace = true, features = ["std", "compress", "v73"] }
consus-netcdf = { workspace = true, features = ["std"] }
consus-zarr = { workspace = true, features = ["std"] }
consus-parquet = { workspace = true, features = ["std", "snappy"] }
consus-hdmf = { workspace = true, features = ["std"] }
pyo3 = { workspace = true, features = ["extension-module"] }
serde_json = { workspace = true }

[build-dependencies]
# Emits the `extension-module` link arguments that PyO3 leaves to the
# extension crate; see build.rs.
pyo3-build-config = { workspace = true }

[lints]
workspace = true
