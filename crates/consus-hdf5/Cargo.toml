[package]
name = "consus-hdf5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust HDF5 format implementation for the Consus scientific storage library"
homepage.workspace = true
readme = "README.md"
keywords = ["hdf5", "scientific-computing", "storage", "chunked", "no-std"]
categories = ["science", "encoding", "filesystem", "no-std"]

[features]
default = ["std"]
std = ["alloc", "consus-core/std", "consus-io/std", "consus-compression/std"]
alloc = ["consus-core/alloc", "consus-io/alloc", "consus-compression/alloc"]
# Async HDF5 parsing is implemented against Moirai's native positioned I/O.
async = ["std", "dep:moirai-async"]
parallel-io = ["alloc", "dep:moirai"]
# Compression codec features — forwarded to consus-compression.
# Required to activate the corresponding codec in the DefaultCodecRegistry.
deflate = ["consus-compression/deflate"]
zstd = ["consus-compression/zstd"]
lz4  = ["consus-compression/lz4"]

[dependencies]
consus-core = { workspace = true }
consus-io = { workspace = true }
consus-compression = { workspace = true }
byteorder = { workspace = true }
moirai = { workspace = true, optional = true }
moirai-async = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
smallvec = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
moirai-async = { workspace = true }

[[bench]]
name = "hdf5_read"
harness = false
required-features = ["alloc"]
[[test]]
name = "async_hdf5"
path = "tests/async_hdf5.rs"
required-features = ["async"]

[lints]
workspace = true
