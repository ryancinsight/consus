[package]
name = "consus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, traits, and error types for the Consus scientific storage library"
homepage.workspace = true
readme = "README.md"
keywords = ["hdf5", "scientific-computing", "storage", "dataset", "no-std"]
categories = ["science", "encoding", "data-structures", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
byteorder = { workspace = true }
smallvec = { workspace = true, features = ["const_generics"] }
zerocopy = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest = { workspace = true }
smallvec = { workspace = true }

[lints]
workspace = true
