[package]
name = "consus-zarr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust Zarr v2/v3 format implementation for the Consus scientific storage library"
homepage.workspace = true
readme = "README.md"
keywords = ["zarr", "chunked", "storage", "scientific-computing"]
categories = ["science", "encoding", "filesystem", "no-std"]

[features]
default = ["std"]
std = ["alloc", "consus-core/std", "consus-io/std", "consus-compression/std", "consus-compression/gzip", "consus-compression/zstd", "consus-compression/lz4", "serde/std", "serde_json/std"]
alloc = ["consus-core/alloc", "consus-io/alloc", "consus-compression/alloc", "serde/alloc", "serde_json/alloc"]


[dependencies]
consus-core = { workspace = true }
consus-io = { workspace = true }
consus-compression = { workspace = true }
# JSON parsing/serialization for Zarr metadata.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "zarr_selection_copy"
harness = false


[lints]
workspace = true
