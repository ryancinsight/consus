[package]
name = "consus-compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Compression codec registry and low-level utilities for the Consus scientific storage library"
homepage.workspace = true
readme = "README.md"
keywords = ["compression", "zstd", "lz4", "blosc", "codec"]
categories = ["compression", "encoding", "no-std"]

[features]
default = ["std", "deflate"]
std = ["consus-core/std", "alloc"]
alloc = ["consus-core/alloc"]
deflate = ["dep:flate2"]
gzip = ["dep:flate2"]
zstd = ["dep:zrip"]
lz4 = ["dep:lz4_flex"]
szip = ["alloc"]
blosc = ["alloc"]

[dependencies]
consus-core = { workspace = true }
byteorder = { workspace = true }
flate2 = { workspace = true, optional = true }
zrip = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
