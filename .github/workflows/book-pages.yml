name: Deploy mdBook
on:
  push:
    branches: [main]
    paths: ["docs/book/**",".github/workflows/book-pages.yml"]
  pull_request:
    paths: ["docs/book/**",".github/workflows/book-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/consus
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: consus-core
      cargo-crate: consus_core