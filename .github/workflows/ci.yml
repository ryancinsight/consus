name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly bounded fuzzing (Monday 03:17 UTC); see the fuzz-run job.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  check:
    name: Check
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - consus
          - consus-core
          - consus-hdf5
          - consus-fits
          - consus-zarr
          - consus-netcdf
          - consus-parquet
          - consus-arrow
          - consus-compression
          - consus-io
          - consus-mat
          - consus-npy
          - consus-onnx
          - consus-nwb
          - consus-hdmf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy
      # Shared-key rust-cache so the 15-package matrix is warm across PRs
      # instead of rebuilding from scratch each time. Default-keyed rust-cache
      # hashes Cargo.lock and wipes target/ on every first-party provider repin
      # (which consus does routinely); shared-key invalidates incrementally and
      # is written from main only so concurrent branches cannot evict it.
      # Mirrors the CFDrs #375/ritk #211/helios #75/eunomia #74 lever under
      # ATLAS-CI-RUNNER-SATURATION.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
          shared-key: consus
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Normalize lock onto current provider heads
        shell: bash
        run: cargo metadata --format-version 1 --all-features > /dev/null
      - name: cargo clippy (${{ matrix.package }})
        run: cargo clippy --locked -p ${{ matrix.package }} --all-features --all-targets -- -D warnings
      - name: cargo check (${{ matrix.package }}, default features)
        run: cargo check --locked -p ${{ matrix.package }}
      - name: cargo check (${{ matrix.package }}, all features)
        run: cargo check --locked -p ${{ matrix.package }} --all-features
      - name: cargo check (no_std core)
        if: matrix.package == 'consus-core'
        run: cargo check --locked -p consus-core --no-default-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package:
          - consus
          - consus-core
          - consus-hdf5
          - consus-fits
          - consus-zarr
          - consus-netcdf
          - consus-parquet
          - consus-arrow
          - consus-compression
          - consus-io
          - consus-mat
          - consus-npy
          - consus-onnx
          - consus-nwb
          - consus-hdmf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
          shared-key: consus
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
      - name: Normalize lock onto current provider heads
        shell: bash
        run: cargo metadata --format-version 1 --all-features > /dev/null
      - name: cargo nextest (${{ matrix.package }})
        run: cargo nextest run --locked -p ${{ matrix.package }} --all-features

  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    env:
      # The install step sets a rustup *default*; the committed rust-toolchain.toml
      # outranks it, so without this the job compiled with the pinned channel.
      RUSTUP_TOOLCHAIN: 1.95.0
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - consus
          - consus-core
          - consus-hdf5
          - consus-fits
          - consus-zarr
          - consus-netcdf
          - consus-parquet
          - consus-arrow
          - consus-compression
          - consus-io
          - consus-mat
          - consus-npy
          - consus-onnx
          - consus-nwb
          - consus-hdmf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
      - name: Prove the toolchain under test
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
          shared-key: consus
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Normalize lock onto current provider heads
        shell: bash
        run: cargo metadata --format-version 1 --all-features > /dev/null
      - name: cargo check (${{ matrix.package }})
        run: cargo check --locked -p ${{ matrix.package }}

  test-mat-features:
    name: Test consus-mat feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
          shared-key: consus
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140
      - name: Normalize lock onto current provider heads
        shell: bash
        run: cargo metadata --format-version 1 --all-features > /dev/null
      - name: cargo nextest (consus-mat, default features)
        run: cargo nextest run --locked -p consus-mat
      - name: cargo nextest (consus-mat, no compress / no v73)
        run: cargo nextest run --locked -p consus-mat --no-default-features --features std,alloc

  # The fuzz crate is excluded from the workspace (`[workspace]` in
  # fuzz/Cargo.toml), so nothing in the matrices above ever compiles it. Left
  # alone, the targets rot silently against API changes until someone tries to
  # run them. This job compiles them on every PR for exactly that reason; it
  # does not fuzz.
  fuzz-build:
    name: Build fuzz targets
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
      # Shared-key rust-cache for the fuzz workspace so targets compile warm
      # instead of cold-building nightly deps on every PR. Mirrors the fleet
      # rust-cache lever under ATLAS-CI-RUNNER-SATURATION; written from main
      # only.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: fuzz
          shared-key: consus-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz@0.13.1
      - name: cargo fuzz build
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu --dev

  # Bounded scheduled fuzzing. Each target runs for a fixed wall-clock budget
  # from the committed seed corpus; a crash fails the job and uploads the
  # reproducer. Not on PRs — a time-boxed random search is not a merge gate.
  fuzz-run:
    name: Fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_hdf5_parser
          - fuzz_parquet_decoder
          - fuzz_mat_reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: fuzz
          shared-key: consus-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz@0.13.1
      # -rss_limit_mb bounds the allocator so a length-field regression shows
      # up as an OOM finding rather than the runner being killed.
      - name: cargo fuzz run (${{ matrix.target }})
        run: >
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          -- -max_total_time=900 -rss_limit_mb=2048 -timeout=25
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
